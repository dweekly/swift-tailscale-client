name: Attach Binaries

# Repair helper: build and attach missing CLI binary assets to an existing
# GitHub Release. Normally release.yml does this on tag push; use this when
# one of its binary jobs failed after the release was published (as the
# Linux job did on v0.6.0). Safe to re-run — existing assets are skipped.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (e.g. v0.6.0)"
        required: true

permissions:
  contents: write

jobs:
  macos-binary:
    name: Attach macOS universal CLI binary
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Build and attach unless present
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          ARCHIVE="tailscale-swift-${TAG}-macos-universal.tar.gz"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets[].name' | grep -qx "$ARCHIVE"; then
            echo "$ARCHIVE already attached; skipping"
            exit 0
          fi
          swift build -c release --arch arm64 --arch x86_64 --product tailscale-swift
          BIN_DIR=$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)
          tar -C "$BIN_DIR" -czf "$ARCHIVE" tailscale-swift
          shasum -a 256 "$ARCHIVE"
          gh release upload "$TAG" "$ARCHIVE" --repo "$GITHUB_REPOSITORY"
