name: Backfill Releases

# One-shot helper for tags that predate release.yml: creates GitHub Releases
# for existing tags, with notes from the current CHANGELOG. Safe to re-run —
# tags that already have a release are skipped.

on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Space-separated existing tags to create releases for"
        required: true
      create:
        description: "Optional space-separated tag@sha pairs to create as annotated tags first"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  backfill:
    name: Create releases from CHANGELOG
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create annotated tags
        if: inputs.create != ''
        env:
          CREATE: ${{ inputs.create }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for PAIR in $CREATE; do
            TAG="${PAIR%@*}"
            SHA="${PAIR#*@}"
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              echo "$TAG already exists; skipping"
              continue
            fi
            git tag -a "$TAG" "$SHA" -m "$TAG"
            git push origin "$TAG"
            echo "Created and pushed $TAG at $SHA"
          done

      - name: Create releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAGS: ${{ inputs.tags }}
        run: |
          for TAG in $TAGS; do
            VERSION="${TAG#v}"
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "$TAG already has a release; skipping"
              continue
            fi
            awk -v ver="$VERSION" '
              $0 ~ "^## \\[" ver "\\]" { found = 1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md > /tmp/notes.md
            if [ -s /tmp/notes.md ]; then
              gh release create "$TAG" --title "$TAG" --notes-file /tmp/notes.md --verify-tag
            else
              echo "::warning::No CHANGELOG entry for $TAG; using auto-generated notes"
              gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
            fi
            echo "Created release for $TAG"
          done
