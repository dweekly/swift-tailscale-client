name: Backfill Releases

# One-shot helper for tags that predate release.yml: creates GitHub Releases
# for existing tags, with notes from the current CHANGELOG. Safe to re-run —
# tags that already have a release are skipped.

on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Space-separated existing tags to create releases for"
        required: true
      create:
        description: "Optional space-separated tag@sha pairs: create tag + release via the Releases API"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  backfill:
    name: Create releases from CHANGELOG
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create tags and releases for tag@sha pairs
        if: inputs.create != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CREATE: ${{ inputs.create }}
        run: |
          # GITHUB_TOKEN cannot git-push refs whose trees differ in workflow
          # files (the 'workflows' permission is not grantable to it), which
          # rules out pushing tags at historical commits. The Releases API is
          # exempt: --target creates the tag server-side with the release.
          for PAIR in $CREATE; do
            TAG="${PAIR%@*}"
            SHA="${PAIR#*@}"
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "$TAG already has a release; skipping"
              continue
            fi
            VERSION="${TAG#v}"
            awk -v ver="$VERSION" '
              $0 ~ "^## \\[" ver "\\]" { found = 1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md > /tmp/notes.md
            if [ -s /tmp/notes.md ]; then
              gh release create "$TAG" --target "$SHA" --title "$TAG" --notes-file /tmp/notes.md
            else
              gh release create "$TAG" --target "$SHA" --title "$TAG" --generate-notes
            fi
            echo "Created tag + release for $TAG at $SHA"
          done

      - name: Create releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAGS: ${{ inputs.tags }}
        run: |
          for TAG in $TAGS; do
            VERSION="${TAG#v}"
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "$TAG already has a release; skipping"
              continue
            fi
            awk -v ver="$VERSION" '
              $0 ~ "^## \\[" ver "\\]" { found = 1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md > /tmp/notes.md
            if [ -s /tmp/notes.md ]; then
              gh release create "$TAG" --title "$TAG" --notes-file /tmp/notes.md --verify-tag
            else
              echo "::warning::No CHANGELOG entry for $TAG; using auto-generated notes"
              gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
            fi
            echo "Created release for $TAG"
          done
