name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-macos:
    name: Test on macOS
    runs-on: macos-26
    # Defense in depth on every job: a hung test should fail the job in
    # minutes, not consume the 6-hour runner default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Cache SPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Check Swift version
        run: swift --version

      - name: Build
        run: swift build -v

      - name: Run tests
        run: swift test -v --enable-code-coverage

      - name: Check code coverage
        run: |
          # .build/debug is a symlink; resolve the real bin dir so find works.
          BIN_DIR=$(swift build --show-bin-path)
          PROFDATA="$BIN_DIR/codecov/default.profdata"
          XCTEST_BIN=$(find "$BIN_DIR" -maxdepth 1 -name '*PackageTests.xctest' | head -1)
          BIN="$XCTEST_BIN/Contents/MacOS/$(basename "$XCTEST_BIN" .xctest)"
          PERCENT=$(xcrun llvm-cov export -summary-only "$BIN" \
            -instr-profile "$PROFDATA" \
            -ignore-filename-regex '(Tests/|\.build/|Sources/tailscale-swift/)' \
            | python3 -c "import json,sys; print(round(json.load(sys.stdin)['data'][0]['totals']['lines']['percent'], 1))")
          # Ratcheted to 70 at v0.9.0 (~79% measured since); raise as coverage
          # grows, never lower without a documented reason (see TESTING.md).
          MIN=70
          echo "Library line coverage: ${PERCENT}% (floor: ${MIN}%)"
          if ! python3 -c "import sys; sys.exit(0 if float('$PERCENT') >= $MIN else 1)"; then
            echo "::error::Line coverage ${PERCENT}% is below the ${MIN}% floor (see Documentation/TESTING.md)"
            exit 1
          fi

      - name: Check formatting
        run: swift format lint --strict --recursive Sources Tests

      - name: Build example (links the library as an external consumer)
        run: swift build --package-path Examples/StatusDemo

      - name: Build and test recipes (compiled documentation snippets)
        run: |
          swift build --package-path Examples/Recipes
          swift test --package-path Examples/Recipes

  test-linux:
    name: Test on Linux
    runs-on: ubuntu-24.04
    container: swift:6.1
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Check Swift version
        run: swift --version

      - name: Build
        run: swift build -v

      - name: Run tests
        run: swift test -v

      - name: Build example (links the library as an external consumer)
        run: swift build --package-path Examples/StatusDemo

      - name: Build and test recipes (compiled documentation snippets)
        run: |
          swift build --package-path Examples/Recipes
          swift test --package-path Examples/Recipes

  docs-consistency:
    name: Docs consistency
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # Version drift across README/DocC/SKILL/coverage/CHANGELOG has
      # slipped through review three separate times; a 5-second grep gate
      # is cheaper than another review round.
      - name: Check advertised versions agree
        run: ./Scripts/check-release-consistency.sh

      # The endpoint tables in LOCALAPI-COVERAGE.md and INTEGRATING.md are
      # rendered from Documentation/endpoints.json; hand-edits must go
      # through the manifest.
      - name: Check generated endpoint tables are in sync
        run: python3 Scripts/generate-endpoint-docs.py --check

      # Recipe articles may only show code that Examples/Recipes compiles.
      - name: Check recipe snippets match compiled sources
        run: python3 Scripts/check-recipe-snippets.py

      # The upstream_maturity axis is only trustworthy if it matches what
      # tailscale/tailscale actually annotates at the pinned commit; this
      # re-derives every annotation from the pinned sources (it has already
      # caught one hand-transcription error).
      - name: Verify upstream maturity ledger against pinned revision
        run: python3 Scripts/verify-upstream-maturity.py

  test-tsan:
    name: Test with Thread Sanitizer
    runs-on: ubuntu-24.04
    container: swift:6.1
    # TSan roughly doubles runtime, so this gets headroom over test-linux.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # TSan guards the concurrency-heavy paths (UnixSocketTransport's
      # detached tasks, the FaultUnixServer test harness) against data
      # races that functional tests would only catch by flaking.
      - name: Build (thread sanitizer)
        run: swift build --sanitize=thread

      - name: Run tests (thread sanitizer)
        run: swift test --sanitize=thread

  build-platforms:
    name: Build (${{ matrix.platform }})
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            destination: generic/platform=iOS Simulator
          - platform: tvOS
            destination: generic/platform=tvOS Simulator
          - platform: watchOS
            destination: generic/platform=watchOS Simulator
    steps:
      - uses: actions/checkout@v7

      - name: Build for ${{ matrix.platform }}
        run: |
          xcodebuild build \
            -scheme TailscaleClient \
            -destination '${{ matrix.destination }}' \
            -skipPackagePluginValidation \
            -skipMacroValidation
