name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-macos:
    name: Test on macOS
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Cache SPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Check Swift version
        run: swift --version

      - name: Build
        run: swift build -v

      - name: Run tests
        run: swift test -v --enable-code-coverage

      - name: Check code coverage
        run: |
          PROFDATA=".build/debug/codecov/default.profdata"
          XCTEST_BIN=$(find .build/debug -maxdepth 2 -name '*PackageTests.xctest' | head -1)
          BIN="$XCTEST_BIN/Contents/MacOS/$(basename "$XCTEST_BIN" .xctest)"
          PERCENT=$(xcrun llvm-cov export -summary-only "$BIN" \
            -instr-profile "$PROFDATA" \
            -ignore-filename-regex '(Tests/|\.build/|Sources/tailscale-swift/)' \
            | python3 -c "import json,sys; print(round(json.load(sys.stdin)['data'][0]['totals']['lines']['percent'], 1))")
          # Initial floor; ratchet toward the targets in Documentation/TESTING.md
          # as the transport/parser tests land (v0.5.0).
          MIN=60
          echo "Library line coverage: ${PERCENT}% (floor: ${MIN}%)"
          if ! python3 -c "import sys; sys.exit(0 if float('$PERCENT') >= $MIN else 1)"; then
            echo "::error::Line coverage ${PERCENT}% is below the ${MIN}% floor (see Documentation/TESTING.md)"
            exit 1
          fi

      - name: Check formatting
        run: swift format lint --strict --recursive Sources Tests

  build-platforms:
    name: Build (${{ matrix.platform }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            destination: generic/platform=iOS Simulator
          - platform: tvOS
            destination: generic/platform=tvOS Simulator
          - platform: watchOS
            destination: generic/platform=watchOS Simulator
    steps:
      - uses: actions/checkout@v7

      - name: Build for ${{ matrix.platform }}
        run: |
          xcodebuild build \
            -scheme TailscaleClient \
            -destination '${{ matrix.destination }}' \
            -skipPackagePluginValidation \
            -skipMacroValidation
