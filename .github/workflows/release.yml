name: Release

# Cutting a release = merging the CHANGELOG roll, then pushing an annotated
# tag (see Documentation/RELEASING.md). This workflow does the rest: verifies
# the tag has a CHANGELOG entry, re-runs the tests, and publishes a GitHub
# Release with the entry as its notes.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches a CHANGELOG entry
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! grep -q "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "::error::No CHANGELOG entry for ${VERSION}; add one before tagging"
            exit 1
          fi

      # The tag must agree with every place the docs advertise a version
      # (README, DocC, agent skill, coverage matrix, CLAUDE.md, CHANGELOG).
      - name: Verify docs agree with the tag
        run: ./Scripts/check-release-consistency.sh "${GITHUB_REF_NAME}"

      - name: Run tests
        run: swift test

      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag

      - name: Build and attach universal macOS CLI binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          swift build -c release --arch arm64 --arch x86_64 --product tailscale-swift
          BIN_DIR=$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)
          ARCHIVE="$RUNNER_TEMP/tailscale-swift-${GITHUB_REF_NAME}-macos-universal.tar.gz"
          tar -C "$BIN_DIR" -czf "$ARCHIVE" tailscale-swift
          shasum -a 256 "$ARCHIVE"
          gh release upload "$GITHUB_REF_NAME" "$ARCHIVE"

  linux-binary:
    name: Attach Linux CLI binary
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: swift:6.1
    steps:
      - uses: actions/checkout@v7

      - name: Install curl
        # The swift container image ships without curl, which the upload
        # step needs (learned the hard way on v0.6.0).
        run: apt-get update -qq && apt-get install -y -qq curl ca-certificates

      - name: Build CLI
        run: |
          swift build -c release --product tailscale-swift
          BIN_DIR=$(swift build -c release --show-bin-path)
          ARCHIVE="tailscale-swift-${GITHUB_REF_NAME}-linux-x86_64.tar.gz"
          tar -C "$BIN_DIR" -czf "$ARCHIVE" tailscale-swift
          sha256sum "$ARCHIVE"

      - name: Upload asset
        # The swift container has no gh CLI; the Releases asset API only
        # needs curl and the workflow token.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARCHIVE="tailscale-swift-${GITHUB_REF_NAME}-linux-x86_64.tar.gz"
          RELEASE_ID=$(curl -sf \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
            | grep -m1 '"id":' | tr -dc '0-9')
          curl -sf -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/gzip" \
            --data-binary "@$ARCHIVE" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$ARCHIVE" \
            > /dev/null
          echo "Attached $ARCHIVE to release $RELEASE_ID"
