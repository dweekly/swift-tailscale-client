name: Release

# Cutting a release = merging the CHANGELOG roll, then pushing an annotated
# tag (see Documentation/RELEASING.md). This workflow does the rest:
# 1. Validates annotated tag and exact commit SHA match.
# 2. Creates a staged draft release with release notes.
# 3. Compiles and smoke-tests macOS universal binary.
# 4. Compiles and smoke-tests Linux x86_64 binary in swift:6.1 container.
# 5. Generates and verifies canonical SHA256SUMS.txt manifest.
# 6. Uploads all assets to draft and promotes to public release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  validate-and-stage:
    name: Validate Tag & Stage Draft Release
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify tag is an annotated tag
        run: |
          TAG_REF="${GITHUB_REF:-refs/tags/$GITHUB_REF_NAME}"
          TAG_TYPE=$(git cat-file -t "$TAG_REF" 2>/dev/null || true)
          if [ "$TAG_TYPE" != "tag" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is of object type '$TAG_TYPE', expected 'tag'."
            echo "::error::Release tags MUST be annotated tags created with 'git tag -a $GITHUB_REF_NAME -m \"...\"'."
            exit 1
          fi
          TAG_SUBJECT=$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME" | xargs)
          if [ -z "$TAG_SUBJECT" ]; then
            echo "::error::Annotated tag '$GITHUB_REF_NAME' contains an empty annotation message."
            exit 1
          fi
          echo "✓ Tag '$GITHUB_REF_NAME' is a valid annotated tag: '$TAG_SUBJECT'"

      - name: Verify exact commit match and clean working tree
        run: |
          TAG_COMMIT=$(git rev-parse "${GITHUB_REF}^{commit}")
          HEAD_COMMIT=$(git rev-parse HEAD)
          echo "Tagged commit:    $TAG_COMMIT"
          echo "Checked-out HEAD: $HEAD_COMMIT"
          if [ "$TAG_COMMIT" != "$HEAD_COMMIT" ]; then
            echo "::error::Checked-out HEAD ($HEAD_COMMIT) does not match tagged commit ($TAG_COMMIT)."
            echo "::error::Release assets must be built from the exact tagged commit."
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Working directory is dirty. Uncommitted changes detected:"
            git status --porcelain
            exit 1
          fi
          echo "✓ Clean working tree verified at commit $TAG_COMMIT"

      - name: Verify tag matches a CHANGELOG entry
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! grep -q "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "::error::No CHANGELOG entry for ${VERSION}; add one before tagging"
            exit 1
          fi

      - name: Verify docs agree with the tag
        run: ./Scripts/check-release-consistency.sh "${GITHUB_REF_NAME}"

      - name: Run tests
        run: swift test

      - name: Extract release notes and create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          cat notes.md

          EXISTING_DRAFT=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' 2>/dev/null || echo "not_found")
          if [ "$EXISTING_DRAFT" = "false" ]; then
            echo "::error::Release $GITHUB_REF_NAME already exists and is not a draft (cannot overwrite published release)"
            exit 1
          elif [ "$EXISTING_DRAFT" = "true" ]; then
            echo "Draft release already exists for $GITHUB_REF_NAME; updating notes"
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --title "$GITHUB_REF_NAME" \
              --notes-file notes.md \
              --verify-tag
          fi

  build-macos-universal:
    name: Build & Smoke-Test macOS Binary
    needs: validate-and-stage
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Build universal CLI binary (arm64 + x86_64)
        run: |
          swift build -c release --arch arm64 --arch x86_64 --product tailscale-swift
          BIN_DIR=$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)
          BIN="$BIN_DIR/tailscale-swift"

          test -x "$BIN"

          LIPO_OUT=$(lipo -info "$BIN")
          echo "$LIPO_OUT"
          echo "$LIPO_OUT" | grep -q "arm64"
          echo "$LIPO_OUT" | grep -q "x86_64"

          # CLI smoke tests
          "$BIN" --help | grep -q "OVERVIEW:"
          "$BIN" --help | grep -q "SUBCOMMANDS:"
          VERSION_OUT=$("$BIN" --version)
          echo "CLI version: $VERSION_OUT"
          test "$VERSION_OUT" = "${GITHUB_REF_NAME#v}"
          "$BIN" help status >/dev/null
          "$BIN" help serve >/dev/null

          # Graceful LocalAPI error handling
          TAILSCALE_LOCALAPI_SOCKET=/tmp/nonexistent-daemon.sock "$BIN" status 2>/dev/null || ERR=$?
          if [ "${ERR:-0}" -gt 128 ]; then
            echo "::error::Binary crashed with exit code $ERR"
            exit 1
          fi

          ARCHIVE="tailscale-swift-${GITHUB_REF_NAME}-macos-universal.tar.gz"
          tar -C "$BIN_DIR" -czf "$ARCHIVE" tailscale-swift
          shasum -a 256 "$ARCHIVE"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: tailscale-swift-*-macos-universal.tar.gz

  build-linux-x86_64:
    name: Build & Smoke-Test Linux Binary
    needs: validate-and-stage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: swift:6.1
    steps:
      - uses: actions/checkout@v7

      - name: Build Linux CLI binary
        run: |
          swift build -c release --product tailscale-swift
          BIN_DIR=$(swift build -c release --show-bin-path)
          BIN="$BIN_DIR/tailscale-swift"

          test -x "$BIN"

          # CLI smoke tests
          "$BIN" --help | grep -q "OVERVIEW:"
          "$BIN" --help | grep -q "SUBCOMMANDS:"
          VERSION_OUT=$("$BIN" --version)
          echo "CLI version: $VERSION_OUT"
          test "$VERSION_OUT" = "${GITHUB_REF_NAME#v}"
          "$BIN" help status >/dev/null
          "$BIN" help serve >/dev/null

          # Graceful LocalAPI error handling
          TAILSCALE_LOCALAPI_SOCKET=/tmp/nonexistent-daemon.sock "$BIN" status 2>/dev/null || ERR=$?
          if [ "${ERR:-0}" -gt 128 ]; then
            echo "::error::Binary crashed with exit code $ERR"
            exit 1
          fi

          ARCHIVE="tailscale-swift-${GITHUB_REF_NAME}-linux-x86_64.tar.gz"
          tar -C "$BIN_DIR" -czf "$ARCHIVE" tailscale-swift
          sha256sum "$ARCHIVE"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: tailscale-swift-*-linux-x86_64.tar.gz

  publish-release:
    name: Verify Checksums & Publish Release
    needs:
      - validate-and-stage
      - build-macos-universal
      - build-linux-x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Compute and verify SHA256SUMS.txt
        run: |
          cd artifacts
          ls -la
          sha256sum tailscale-swift-*.tar.gz | LC_ALL=C sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Attach assets and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd artifacts
          gh release upload "$GITHUB_REF_NAME" tailscale-swift-*.tar.gz SHA256SUMS.txt --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
          echo "✓ Release $GITHUB_REF_NAME published successfully."
