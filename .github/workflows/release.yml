name: Release

# Cutting a release = merging the CHANGELOG roll, then pushing an annotated
# tag (see Documentation/RELEASING.md). This workflow does the rest: verifies
# the tag has a CHANGELOG entry, re-runs the tests, and publishes a GitHub
# Release with the entry as its notes.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches a CHANGELOG entry
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! grep -q "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "::error::No CHANGELOG entry for ${VERSION}; add one before tagging"
            exit 1
          fi

      - name: Run tests
        run: swift test

      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag
